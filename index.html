<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMARANG CITY TRAINS - Petualangan Masinis Cilik</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Fredoka for playful children learning style -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* 16:9 Responsive Container Aspect Ratio */
        .game-viewport {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            position: relative;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 4px solid #38bdf8;
        }

        @media (max-aspect-ratio: 16/9) {
            .game-viewport {
                aspect-ratio: auto;
                min-height: 92vh;
            }
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #0284c7;
            border-radius: 8px;
        }

        /* Flip Card Animation */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Cartoon Shadows and Buttons */
        .btn-cartoon {
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.25);
            position: relative;
            top: 0;
        }
        .btn-cartoon:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 rgba(0,0,0,0.25);
        }
        .btn-cartoon:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.25);
        }

        /* Keyframe Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        @keyframes trainChug {
            0% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(2px) translateY(-3px); }
            50% { transform: translateX(0) translateY(0); }
            75% { transform: translateX(-2px) translateY(-2px); }
            100% { transform: translateX(0) translateY(0); }
        }
        .animate-train {
            animation: trainChug 0.8s ease-in-out infinite;
        }

        @keyframes puffSmoke {
            0% { transform: scale(0.3) translateY(0) opacity(0.8); opacity: 0.8; }
            100% { transform: scale(1.5) translateY(-40px) opacity(0); opacity: 0; }
        }
        .smoke-puff {
            animation: puffSmoke 1.5s ease-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.8)); }
            50% { filter: drop-shadow(0 0 20px rgba(250, 204, 21, 1)); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        /* Canvas Confetti Layer */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Drag and Drop visual feedback */
        .draggable-item {
            cursor: grab;
            touch-action: none;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .drop-target-active {
            border-color: #0284c7 !important;
            background-color: #e0f2fe !important;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 bg-slate-900 text-slate-800">

    <div id="gameViewport" class="game-viewport flex flex-col justify-between select-none overflow-hidden relative">
        <canvas id="confettiCanvas"></canvas>

        <!-- TOP BAR / HEADER NAV (Hidden on splash) -->
        <header id="topNav" class="hidden bg-slate-900/90 backdrop-blur text-white px-4 py-2 z-30 flex items-center justify-between border-b-4 border-amber-400">
            <div class="flex items-center space-x-3">
                <button onclick="navigateTo('map')" class="btn-cartoon bg-sky-500 hover:bg-sky-400 text-white font-bold py-1 px-3 rounded-xl text-sm flex items-center gap-1 border-2 border-white">
                    <i class="fa-solid fa-map"></i> <span class="hidden sm:inline">Peta Semarang</span>
                </button>
                <div class="bg-slate-800 px-3 py-1 rounded-xl border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-train text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-300 hidden md:inline">STASIUN:</span>
                    <span id="currentStationName" class="text-xs sm:text-sm font-bold text-amber-300">Semarang</span>
                </div>
            </div>

            <!-- Progress & Score -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-xl border border-slate-700">
                    <i class="fa-solid fa-star text-yellow-400 text-base animate-pulse"></i>
                    <span id="scoreDisplay" class="font-bold text-yellow-400 text-sm sm:text-base">0 Poin</span>
                </div>
                
                <div class="hidden sm:flex flex-col w-28 md:w-36">
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span class="text-slate-300">PROGRESS</span>
                        <span id="progressText" class="text-emerald-400">0/16</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden p-0.5 border border-slate-600">
                        <div id="progressBar" class="bg-gradient-to-r from-emerald-400 to-teal-300 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Audio Toggle -->
                <button id="audioToggleBtn" onclick="toggleAudio()" class="btn-cartoon bg-amber-500 hover:bg-amber-400 text-white font-bold p-2 rounded-xl text-sm border-2 border-white">
                    <i id="audioIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </header>

        <!-- MAIN DYNAMIC CONTENT CONTAINER -->
        <main id="mainContainer" class="flex-1 relative overflow-y-auto overflow-x-hidden flex flex-col justify-center items-center p-3 sm:p-6">
            <!-- Dynamic Screens will be injected here via JavaScript -->
        </main>

        <!-- REUSABLE SUCCESS / ALERT MODAL -->
        <div id="gameModal" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div id="modalCard" class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full border-4 border-amber-400 shadow-2xl text-center transform transition-all duration-300 scale-90 opacity-0">
                <div id="modalIcon" class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl text-amber-500 shadow-inner">
                    🌟
                </div>
                <h2 id="modalTitle" class="text-2xl font-black text-slate-800 mb-2">Hebat Sekali!</h2>
                <p id="modalBody" class="text-slate-600 font-semibold mb-6">Kamu telah berhasil menyelesaikan misi ini!</p>
                <div id="modalButtons" class="flex justify-center gap-3">
                    <button onclick="closeModal()" class="btn-cartoon bg-sky-500 hover:bg-sky-400 text-white font-bold py-2.5 px-6 rounded-2xl border-2 border-white text-base">
                        Lanjut
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playClick() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playWhistle() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                
                // Two sine waves for harmonic train whistle sound
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.4);
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.8);
                });
            }

            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((note, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.25);
                });
            }

            playWrong() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }

            playFanfare() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const melody = [
                    { f: 523.25, t: 0, d: 0.15 },
                    { f: 523.25, t: 0.15, d: 0.15 },
                    { f: 523.25, t: 0.30, d: 0.15 },
                    { f: 659.25, t: 0.45, d: 0.35 },
                    { f: 783.99, t: 0.85, d: 0.4 }
                ];
                melody.forEach(n => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(n.f, now + n.t);
                    gain.gain.setValueAtTime(0.25, now + n.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + n.t);
                    osc.stop(now + n.t + n.d);
                });
            }
        }

        const audio = new SoundEngine();

        function toggleAudio() {
            audio.muted = !audio.muted;
            const btn = document.getElementById('audioToggleBtn');
            const icon = document.getElementById('audioIcon');
            if (audio.muted) {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.classList.replace('bg-amber-500', 'bg-slate-500');
            } else {
                icon.className = 'fa-solid fa-volume-high';
                btn.classList.replace('bg-slate-500', 'bg-amber-500');
                audio.playClick();
            }
        }

        const GAME_STATE = {
            playerName: "Masinis Cilik",
            score: 0,
            completedStations: new Set(),
            currentStationId: null,
            pretestScore: 0,
            evalScore: 0,
            badges: new Set(),
            reflection: {}
        };

        // 16 Kecamatan / Station Metadata
        const STATIONS = [
            { id: 'banyumanik', name: 'Banyumanik', label: 'Petunjuk Bermain', icon: 'fa-book-open', x: 45, y: 82 },
            { id: 'candisari', name: 'Candisari', label: 'Tujuan Pembelajaran', icon: 'fa-bullseye', x: 52, y: 62 },
            { id: 'gajahmungkur', name: 'Gajahmungkur', label: 'Pretest Masinis', icon: 'fa-clipboard-check', x: 42, y: 64 },
            { id: 'gayamsari', name: 'Gayamsari', label: 'Rahasia Energi', icon: 'fa-lightbulb', x: 62, y: 50 },
            { id: 'genuk', name: 'Genuk', label: 'Detektif Benda', icon: 'fa-magnifying-glass', x: 78, y: 35 },
            { id: 'gunungpati', name: 'Gunungpati', label: 'Bentuk-Bentuk Energi', icon: 'fa-shapes', x: 28, y: 78 },
            { id: 'mijen', name: 'Mijen', label: 'Energi Gerak', icon: 'fa-person-running', x: 15, y: 65 },
            { id: 'ngaliyan', name: 'Ngaliyan', label: 'Energi Cahaya', icon: 'fa-sun', x: 25, y: 48 },
            { id: 'pedurungan', name: 'Pedurungan', label: 'Energi Panas', icon: 'fa-fire', x: 72, y: 62 },
            { id: 'semarang_barat', name: 'Semarang Barat', label: 'Energi Bunyi', icon: 'fa-volume-high', x: 38, y: 40 },
            { id: 'semarang_selatan', name: 'Semarang Selatan', label: 'Energi Listrik', icon: 'fa-bolt', x: 50, y: 52 },
            { id: 'semarang_tengah', name: 'Semarang Tengah', label: 'Energi Kimia', icon: 'fa-battery-full', x: 48, y: 42 },
            { id: 'semarang_timur', name: 'Semarang Timur', label: 'Memory Pair', icon: 'fa-clone', x: 58, y: 40 },
            { id: 'semarang_utara', name: 'Semarang Utara', label: 'Evaluasi Akhir', icon: 'fa-graduation-cap', x: 52, y: 28 },
            { id: 'tembalang', name: 'Tembalang', label: 'Refleksi Siswa', icon: 'fa-comment-dots', x: 65, y: 75 },
            { id: 'tugu', name: 'Tugu', label: 'Papan Skor & Penghargaan', icon: 'fa-trophy', x: 18, y: 32 }
        ];

        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const particles = [];
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.8) * 12,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.2; // Gravity
                        p.life -= 1.5;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                if (alive) requestAnimationFrame(animate);
            }
            animate();
        }

        function showModal(title, bodyText, iconEmoji = '🎉', onNext = null) {
            audio.playCorrect();
            triggerConfetti();
            const modal = document.getElementById('gameModal');
            const card = document.getElementById('modalCard');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = bodyText;
            document.getElementById('modalIcon').innerText = iconEmoji;

            const btnContainer = document.getElementById('modalButtons');
            btnContainer.innerHTML = `
                <button id="modalConfirmBtn" class="btn-cartoon bg-sky-500 hover:bg-sky-400 text-white font-bold py-2.5 px-6 rounded-2xl border-2 border-white text-base">
                    Lanjut <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            `;

            document.getElementById('modalConfirmBtn').onclick = () => {
                closeModal();
                if (onNext) onNext();
            };

            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-90', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            audio.playClick();
            const modal = document.getElementById('gameModal');
            const card = document.getElementById('modalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-90', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function updateUIHeader() {
            document.getElementById('scoreDisplay').innerText = `${GAME_STATE.score} Poin`;
            document.getElementById('progressText').innerText = `${GAME_STATE.completedStations.size}/16`;
            const pct = (GAME_STATE.completedStations.size / 16) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;

            if (GAME_STATE.currentStationId) {
                const st = STATIONS.find(s => s.id === GAME_STATE.currentStationId);
                document.getElementById('currentStationName').innerText = st ? st.name : 'Semarang';
            } else {
                document.getElementById('currentStationName').innerText = 'Peta Semarang';
            }
        }

        function awardPoints(pts) {
            GAME_STATE.score += pts;
            updateUIHeader();
        }

        function markStationComplete(stationId) {
            GAME_STATE.completedStations.add(stationId);
            checkBadges();
            updateUIHeader();
        }

        function checkBadges() {
            if (GAME_STATE.completedStations.size >= 1) GAME_STATE.badges.add('MASINIS_PEMULA');
            if (GAME_STATE.completedStations.has('genuk')) GAME_STATE.badges.add('DETEKTIF_ENERGI');
            if (GAME_STATE.completedStations.has('gunungpati')) GAME_STATE.badges.add('AHLI_ENERGI');
            if (GAME_STATE.score >= 90) GAME_STATE.badges.add('MASINIS_HEBAT');
            if (GAME_STATE.completedStations.size >= 16) GAME_STATE.badges.add('PENJELAJAH_SEMARANG');
        }

        function navigateTo(screenId) {
            audio.playClick();
            const main = document.getElementById('mainContainer');
            const topNav = document.getElementById('topNav');

            if (screenId === 'opening') {
                topNav.classList.add('hidden');
            } else {
                topNav.classList.remove('hidden');
            }

            GAME_STATE.currentStationId = (screenId !== 'opening' && screenId !== 'map') ? screenId : null;
            updateUIHeader();

            main.innerHTML = ''; // Clear container

            switch(screenId) {
                case 'opening': renderOpeningScreen(main); break;
                case 'map': renderMapScreen(main); break;
                case 'banyumanik': renderBanyumanik(main); break;
                case 'candisari': renderCandisari(main); break;
                case 'gajahmungkur': renderGajahmungkur(main); break;
                case 'gayamsari': renderGayamsari(main); break;
                case 'genuk': renderGenuk(main); break;
                case 'gunungpati': renderGunungpati(main); break;
                case 'mijen': renderMijen(main); break;
                case 'ngaliyan': renderNgaliyan(main); break;
                case 'pedurungan': renderPedurungan(main); break;
                case 'semarang_barat': renderSemarangBarat(main); break;
                case 'semarang_selatan': renderSemarangSelatan(main); break;
                case 'semarang_tengah': renderSemarangTengah(main); break;
                case 'semarang_timur': renderSemarangTimur(main); break;
                case 'semarang_utara': renderSemarangUtara(main); break;
                case 'tembalang': renderTembalang(main); break;
                case 'tugu': renderTugu(main); break;
                default: renderMapScreen(main); break;
            }
        }

        function renderOpeningScreen(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center max-w-3xl mx-auto my-auto py-4 px-2">
                    <!-- Train Mascot SVG -->
                    <div class="relative mb-4 animate-float">
                        <div class="absolute -top-6 right-8 flex space-x-1">
                            <div class="w-4 h-4 bg-slate-300 rounded-full smoke-puff"></div>
                            <div class="w-6 h-6 bg-slate-200 rounded-full smoke-puff" style="animation-delay: 0.3s"></div>
                        </div>
                        <svg class="w-48 h-32 sm:w-64 sm:h-40 mx-auto drop-shadow-xl" viewBox="0 0 200 120" fill="none">
                            <rect x="20" y="40" width="120" height="60" rx="12" fill="#0284c7" />
                            <rect x="130" y="20" width="50" height="80" rx="10" fill="#0369a1" />
                            <rect x="140" y="30" width="30" height="30" rx="6" fill="#fef08a" />
                            <!-- Mascot Hat in window -->
                            <circle cx="155" cy="45" r="8" fill="#f97316" />
                            <rect x="25" y="25" width="20" height="25" rx="4" fill="#ea580c" />
                            <circle cx="50" cy="100" r="14" fill="#334155" />
                            <circle cx="50" cy="100" r="6" fill="#94a3b8" />
                            <circle cx="100" cy="100" r="14" fill="#334155" />
                            <circle cx="100" cy="100" r="6" fill="#94a3b8" />
                            <circle cx="150" cy="100" r="14" fill="#334155" />
                            <circle cx="150" cy="100" r="6" fill="#94a3b8" />
                            <path d="M 10 100 L 190 100" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
                        </svg>
                    </div>

                    <h1 class="text-3xl sm:text-5xl font-black text-sky-900 tracking-tight mb-1 drop-shadow-sm">
                        🚆 SEMARANG CITY TRAINS
                    </h1>
                    <p class="text-base sm:text-xl font-bold text-amber-600 mb-4">
                        “Petualangan Masinis Cilik Mengungkap Rahasia Energi”

                const btn = document.getElementById(`memCard-${idx}`);
                if (!btn) return;

                const back = btn.querySelector('.card-back');
                const front = btn.querySelector('.card-front');

                if (btn.classList.contains('matched') || btn === firstCard?.btn) return;

                audio.playClick();
                back.classList.add('hidden');

                btn.classList.replace('bg-sky-500', 'bg-amber-400');

                if (!firstCard) {

                                card1.btn.querySelector('.card-front')?.classList.add('hidden');
                                card1.btn.classList.replace('bg-amber-400', 'bg-sky-500');
                            }
                            isBoardLocked = false;
                        }, 800);
                    }
                }
            };
        }

                        </div>

                        <div>
                            <label class="font-bold block mb-1">2. Contoh sikap bijak menggunakan energi listrik:</label>
                            <div class="space-y-1">
                                <label class="flex items-center gap-2"><input type="checkbox" checked class="w-4 h-4 text-emerald-600 rounded"> Mematikan lampu jika tidak digunakan</label>
                                <label class="flex items-center gap-2"><input type="checkbox" checked class="w-4 h-4 text-emerald-600 rounded"> Menggunakan listrik seperlunya</label>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-6">
                        <button onclick="markStationComplete('tembalang'); showModal('Refleksi Tersimpan!', 'Terima kasih atas refleksimu, Masinis!', '💭', () => navigateTo('tugu'));" 
                                class="btn-cartoon bg-purple-500 hover:bg-purple-400 text-white font-black py-3 px-8 rounded-2xl border-2 border-white text-base">
                            KIRIM REFLEKSI & KE TUGU ▶
                        </button>
                    </div>
                </div>
            `;

            window.selectReflectEmoji = function(btn) {
                audio.playClick();
                btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('bg-purple-200', 'border-purple-500'));
                btn.classList.add('bg-purple-200', 'border-purple-500');
            };
        }

        function renderTugu(container) {
            markStationComplete('tugu');

            // Save to localStorage
            let scoresData = JSON.parse(localStorage.getItem('semarang_city_trains_scores') || '[]');
            const existingIdx = scoresData.findIndex(s => s.name === GAME_STATE.playerName);
            if (existingIdx >= 0) {
                scoresData[existingIdx].score = Math.max(scoresData[existingIdx].score, GAME_STATE.score);
            } else {
                scoresData.push({ name: GAME_STATE.playerName, score: GAME_STATE.score, stars: '⭐⭐⭐⭐⭐' });
            }
            scoresData.sort((a, b) => b.score - a.score);
            localStorage.setItem('semarang_city_trains_scores', JSON.stringify(scoresData));

            container.innerHTML = `
                <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 border-4 border-amber-400 shadow-xl text-center">
                    <span class="bg-amber-100 text-amber-800 font-bold px-4 py-1 rounded-full text-xs">
                        🚉 STASIUN TUGU (AKHIR PETUALANGAN)
                    </span>
                    <h2 class="text-2xl font-black text-slate-800 mt-1 mb-3">🏆 PAPAN SKOR MASINIS CILIK</h2>

                    <!-- Badges Row -->
                    <div class="flex justify-center gap-2 mb-4">
                        ${Array.from(GAME_STATE.badges).map(b => `
                            <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full border border-amber-300">
                                🎖️ ${b.replace('_', ' ')}
                            </span>
                        `).join('')}
                    </div>

                    <!-- Leaderboard Table -->
                    <div class="bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden mb-6 text-xs sm:text-sm">
                        <table class="w-full text-left">
                            <thead class="bg-amber-400 text-slate-900 font-bold">
                                <tr>
                                    <th class="p-3">Peringkat</th>
                                    <th class="p-3">Masinis</th>
                                    <th class="p-3 text-right">Skor Total</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${scoresData.slice(0, 5).map((row, idx) => `
                                    <tr class="${row.name === GAME_STATE.playerName ? 'bg-amber-100 font-bold' : ''}">
                                        <td class="p-3">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`}</td>
                                        <td class="p-3">${row.name}</td>
                                        <td class="p-3 text-right font-black text-sky-700">${row.score} Poin</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3">
                        <button onclick="resetGameData()" class="btn-cartoon bg-rose-500 hover:bg-rose-400 text-white font-bold py-2.5 px-5 rounded-2xl border-2 border-white text-xs sm:text-sm">
                            🗑️ HAPUS DATA SKOR
                        </button>
                        <button onclick="navigateTo('opening')" class="btn-cartoon bg-amber-500 hover:bg-amber-400 text-white font-bold py-2.5 px-5 rounded-2xl border-2 border-white text-xs sm:text-sm">
                            🔄 MAIN LAGI
                        </button>
                    </div>
                </div>
            `;

            window.resetGameData = function() {
                if (confirm('Apakah kamu yakin ingin menghapus seluruh papan skor?')) {
                    localStorage.removeItem('semarang_city_trains_scores');
                    renderTugu(container);
                }
            };
        }

        window.onload = function() {
            navigateTo('opening');
        };
    </script>
</body>
</html>
